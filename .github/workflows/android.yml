name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['public/audio/stories/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Read version
        id: v
        run: |
          V=$(node -p "require('./release.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          IFS=. read MA MI PA <<< "$V"
          echo "code=$((MA*10000 + MI*100 + PA))" >> $GITHUB_OUTPUT
      - run: npm ci
      - name: Fetch opening ayah audio (Minshawi, Al-Baqarah 152)
        run: mkdir -p public/audio/intro && curl -fsSL --retry 4 -o public/audio/intro/2-152.mp3 https://everyayah.com/data/Minshawy_Murattal_128kbps/002152.mp3 && ls -la public/audio/intro || echo "opening ayah fetch failed"
      - run: npm run build
      - run: npx cap sync android
      - name: Build signed APK
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          chmod +x gradlew
          set -o pipefail
          for n in 1 2 3; do
            ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build.log && break
            grep -q "Could not resolve\|Could not find\|Connection reset\|timed out" ../build.log || exit 1
            [ $n = 3 ] && exit 1
            echo "network problem, retry $n"; sleep 20
          done
          cp app/build/outputs/apk/release/app-release.apk ../alrafiq.apk
      - name: Report build failure
        if: failure()
        run: |
          tail -200 build.log > /tmp/fail.log || echo "no log" > /tmp/fail.log
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan ci-fail && git rm -rqf --cached . && cp /tmp/fail.log build-fail.log && git add -f build-fail.log && git commit -qm "build failure log"
          git push -qf origin HEAD:refs/heads/ci-log/${{ steps.v.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: alrafiq-apk
          path: alrafiq.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: الرفيق ${{ steps.v.outputs.version }}
          body: "تطبيق الرفيق لأندرويد — حمّل ملف alrafiq.apk وثبّته. تم تصميم وتطوير التطبيق بواسطة Mohamed Eldawly"
          files: alrafiq.apk
          make_latest: true
          overwrite_files: true
