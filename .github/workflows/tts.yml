name: Generate story audio
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'معرّف فصل واحد للتجربة (اتركه فارغًا لتوليد الكل)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: tts
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate audio with Azure (ar-EG-ShakirNeural)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: node scripts/tts-stories.mjs "${{ github.event.inputs.only }}"
      - name: Commit audio
        run: |
          git config user.name "alrafiq-bot"
          git config user.email "alrafiq-bot@users.noreply.github.com"
          git add public/audio/stories
          git diff --cached --quiet || git commit -m "توليد صوت القصص"
          git push
