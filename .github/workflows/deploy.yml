name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Generate story audio']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch opening ayah audio (Minshawi, Al-Baqarah 152)
        run: mkdir -p public/audio/intro && curl -fsSL --retry 4 -o public/audio/intro/2-152.mp3 https://everyayah.com/data/Minshawy_Murattal_128kbps/002152.mp3 && ls -la public/audio/intro || echo "opening ayah fetch failed"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
